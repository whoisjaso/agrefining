# Cloudflare Worker for agrefining (preview on workers.dev; no custom domain attached yet).
# Site files are served from KV (binding SITE), uploaded by cloudflare/build.mjs.
name = "agrefining"
main = ".cf-deploy/worker.js"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[[kv_namespaces]]
binding = "SITE"
id = "095a661afd81401fa3b655b3b4663538"

# Optional secrets (none are set on Vercel today): RESEND_API_KEY, DESK_ACCESS_CODE,
# AG_LEAD_FROM_EMAIL, AG_LEAD_TO_EMAIL, GOOGLE_SITE_VERIFICATION, BING_SITE_VERIFICATION
