name: Publish Verified AG Refining Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ag-release-import.yml

permissions:
  contents: write

concurrency:
  group: ag-release-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Out Main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download Verified Release Archives
        env:
          RELEASE_BASE_URL: https://temporary-instant-slate-stezred.vercel.app
          RELEASE_SHARE_URL: https://temporary-instant-slate-stezred.vercel.app/?_vercel_share=7xF5lpdIJkNDmLItZnlFQXCBWXOB2J7n
        run: |
          set -euo pipefail
          curl --fail --location --cookie-jar "$RUNNER_TEMP/vercel.cookies" "$RELEASE_SHARE_URL" --output /dev/null
          for archive in masters qa site; do
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 2               --cookie "$RUNNER_TEMP/vercel.cookies"               "$RELEASE_BASE_URL/ag-release-$archive.zip"               --output "$RUNNER_TEMP/ag-release-$archive.zip"
          done
          echo "36064711c558c981d3dae209c26dada088f2648fe16656a9772639f76442a420  $RUNNER_TEMP/ag-release-masters.zip" | sha256sum --check
          echo "11274d55ed5a94c0fc3f31374830e90f16ec06e67aac7eb0d1e57f6a08a87c98  $RUNNER_TEMP/ag-release-qa.zip" | sha256sum --check
          echo "a9352f25e03e7c1183973a804c73c3c339969a1d907b7f9b1e05bf57fec893fa  $RUNNER_TEMP/ag-release-site.zip" | sha256sum --check

      - name: Replace Repository With Tested Tree
        run: |
          set -euo pipefail
          git rm --recursive .
          unzip -q "$RUNNER_TEMP/ag-release-masters.zip" -d .
          unzip -q "$RUNNER_TEMP/ag-release-qa.zip" -d .
          unzip -q "$RUNNER_TEMP/ag-release-site.zip" -d .
          git add --all
          git diff --cached --check
          test "$(git write-tree)" = "64bb3455f5c653dd475be211747e030fac960a26"

      - name: Publish Release
        run: |
          set -euo pipefail
          git config user.name "whoisjaso"
          git config user.email "168715273+whoisjaso@users.noreply.github.com"
          git commit --message "Publish verified AG Refining release"
          git push origin HEAD:main
